root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
entrypoint = "./tmp/main"
include_ext = ["go"]
exclude_dir = ["tmp", "static"]
exclude_regex = ["_test\\.go"]

# Editing a .templ file regenerates the Go code; the rebuild follows
# naturally when the generated .go files change.
[[build.rules]]
name = "templ"
include_ext = ["templ"]
cmd = "go tool templ generate"

[proxy]
enabled = true
proxy_port = 8090
app_port = 8080
